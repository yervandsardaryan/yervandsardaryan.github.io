text x="1931.5" y="750.5" text-anchor="middle" fill="#f5f9ff" font-family="Arial,sans-serif" font-size="15" font-weight="600">Dispense cash</text><text x="1931.5" y="769.5" text-anchor="middle" fill="#f5f9ff" font-family="Arial,sans-serif" font-size="15" font-weight="600">report result</text><rect x="1854" y="412" width="155" height="82" rx="12" fill="#1c4051" stroke="#5888a2" stroke-width="1.6"/><text x="1931.5" y="448.5" text-anchor="middle" fill="#f5f9ff" font-family="Arial,sans-serif" font-size="15" font-weight="600">Post / reconcile</text><text x="1931.5" y="467.5" text-anchor="middle" fill="#f5f9ff" font-family="Arial,sans-serif" font-size="15" font-weight="600">mark code Used</text><circle cx="1905" cy="173" r="24" fill="#102438" stroke="#e3e9f4" stroke-width="3"/><circle cx="1905" cy="173" r="13" fill="none" stroke="#e3e9f4"/><text x="1905" y="216" text-anchor="middle" fill="#dce7f4" font-family="Arial,sans-serif" font-size="13">Collect cash</text><circle cx="1811" cy="520" r="24" fill="#102438" stroke="#e3e9f4" stroke-width="3"/><circle cx="1811" cy="520" r="13" fill="none" stroke="#e3e9f4"/><text x="1811" y="563" text-anchor="middle" fill="#dce7f4" font-family="Arial,sans-serif" font-size="13">Reject code</text><circle cx="1075" cy="446" r="24" fill="#102438" stroke="#f0ab80" stroke-width="2"/><circle cx="1075" cy="446" r="15" fill="none" stroke="#f0ab80"/><path d="M1075 435 L1075 446 L1084 451" fill="none" stroke="#f0ab80" stroke-width="2"/><text x="1075" y="489" text-anchor="middle" fill="#dce7f4" font-family="Arial,sans-serif" font-size="13">15 min</text><rect x="1171" y="410" width="170" height="73" rx="12" fill="#523d36" stroke="#d3a276" stroke-width="1.6"/><text x="1256.0" y="442.0" text-anchor="middle" fill="#f5f9ff" font-family="Arial,sans-serif" font-size="15" font-weight="600">Expire if Active</text><text x="1256.0" y="461.0" text-anchor="middle" fill="#f5f9ff" font-family="Arial,sans-serif" font-size="15" font-weight="600">reject late use</text>