<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 910" role="img" aria-labelledby="t d"><title id="t">Learning Management System integration architecture</title><desc id="d">Lecturer and student clients, identity provider, backend API, PostgreSQL metadata, object storage, transcoding, CDN streaming and asynchronous queue notifications.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#79d8c3"/></marker><marker id="soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#93a7c1"/></marker></defs><rect width="1520" height="910" rx="24" fill="#0d1728"/><text x="60" y="64" fill="#73e3c5" font-size="17" font-family="Arial" font-weight="700" letter-spacing="3">SYSTEM INTEGRATION · REFERENCE ARCHITECTURE</text><text x="60" y="108" fill="#f4f8ff" font-size="31" font-family="Arial" font-weight="700">Learning Management System — Video Publishing</text><text x="60" y="145" fill="#a4bacf" font-size="16" font-family="Arial">Direct multipart upload · asynchronous transcoding · enrollment-aware access · event-driven notifications</text><rect x="60" y="205" width="250" height="105" rx="14" fill="#192b40" stroke="#70ddbd" stroke-opacity=".65" stroke-width="1.8"/><text x="78" y="236" fill="#f4f8ff" font-family="Arial" font-size="18" font-weight="700">Lecturer / Student</text><text x="78" y="262" fill="#b5c6da" font-family="Arial" font-size="14">React or Mobile App</text><text x="78" y="283" fill="#b5c6da" font-family="Arial" font-size="14">Login · Upload · Watch</text><rect x="455" y="205" width="250" height="105" rx="14" fill="#192b40" stroke="#70ddbd" stroke-opacity=".65" stroke-width="1.8"/><text x="473" y="236" fill="#f4f8ff" font-family="Arial" font-size="18" font-weight="700">Backend REST API</text><text x="473" y="262" fill="#b5c6da" font-family="Arial" font-size="14">Authorization · Video metadata</text><text x="473" y="283" fill="#b5c6da" font-family="Arial" font-size="14">Enrollment · Signed URLs</text><rect x="850" y="205" width="260" height="105" rx="14" fill="#192b40" stroke="#7ab7ee" stroke-opacity=".65" stroke-width="1.8"/><text x="868" y="236" fill="#f4f8ff" font-family="Arial" font-size="18" font-weight="700">Identity Provider</text><text x="868" y="262" fill="#b5c6da" font-family="Arial" font-size="14">University SSO / OIDC</text><text x="868" y="283" fill="#b5c6da" font-family="Arial" font-size="14">JWT claims and sessions</text><rect x="455" y="375" width="250" height="100" rx="14" fill="#192b40" stroke="#7ab7ee" stroke-opacity=".65" stroke-width="1.8"/><text x="473" y="406" fill="#f4f8ff" font-family="Arial" font-size="18" font-weight="700">PostgreSQL</text><text x="473" y="432" fill="#b5c6da" font-family="Arial" font-size="14">Courses · Enrollments</text><text x="473" y="453" fill="#b5c6da" font-family="Arial" font-size="14">Video status · Audit logs</text><rect x="60" y="395" width="250" height="102" rx="14" fill="#192b40" stroke="#70ddbd" stroke-opacity=".65" stroke-width="1.8"/><text x="78" y="426" fill="#f4f8ff" font-family="Arial" font-size="18" font-weight="700">Object Storage</text><text x="78" y="452" fill="#b5c6da" font-family="Arial" font-size="14">S3 / Azure Blob / GCS</text><text x="78" y="473" fill="#b5c6da" font-family="Arial" font-size="14">Original files · multipart</text><rect x="60" y="585" width="250" height="100" rx="14" fill="#192b40" stroke="#70ddbd" stroke-opacity=".65" stroke-width="1.8"/><text x="78" y="616" fill="#f4f8ff" font-family="Arial" font-size="18" font-weight="700">Video Processor</text><text x="78" y="642" fill="#b5c6da" font-family="Arial" font-size="14">FFmpeg / MediaConvert</text><text x="78" y="663" fill="#b5c6da" font-family="Arial" font-size="14">Transcode · HLS · Thumbnail</text><rect x="455" y="585" width="250" height="100" rx="14" fill="#192b40" stroke="#70ddbd" stroke-opacity=".65" stroke-width="1.8"/><text x="473" y="616" fill="#f4f8ff" font-family="Arial" font-size="18" font-weight="700">CDN / Streaming</text><text x="473" y="642" fill="#b5c6da" font-family="Arial" font-size="14">Signed HLS delivery</text><text x="473" y="663" fill="#b5c6da" font-family="Arial" font-size="14">Adaptive bitrate playback</text><rect x="850" y="395" width="260" height="105" rx="14" fill="#192b40" stroke="#ebc17b" stroke-opacity=".65" stroke-width="1.8"/><text x="868" y="426" fill="#f4f8ff" font-family="Arial" font-size="18" font-weight="700">Message Queue</text><text x="868" y="452" fill="#b5c6da" font-family="Arial" font-size="14">SQS / RabbitMQ / Kafka</text><text x="868" y="473" fill="#b5c6da" font-family="Arial" font-size="14">video.published event</text><rect x="850" y="585" width="260" height="100" rx="14" fill="#192b40" stroke="#ebc17b" stroke-opacity=".65" stroke-width="1.8"/><text x="868" y="616" fill="#f4f8ff" font-family="Arial" font-size="18" font-weight="700">Notification Worker</text><text x="868" y="642" fill="#b5c6da" font-family="Arial" font-size="14">Read enrollments · Deduplicate</text><text x="868" y="663" fill="#b5c6da" font-family="Arial" font-size="14">Batch + retry</text><rect x="1175" y="585" width="275" height="100" rx="14" fill="#192b40" stroke="#ebc17b" stroke-opacity=".65" stroke-width="1.8"/><text x="1193" y="616" fill="#f4f8ff" font-family="Arial" font-size="18" font-weight="700">Email / Push Providers</text><text x="1193" y="642" fill="#b5c6da" font-family="Arial" font-size="14">SendGrid / Firebase</text><text x="1193" y="663" fill="#b5c6da" font-family="Arial" font-size="14">Student notification</text><polyline points="310,254 455,254" fill="none" stroke="#79d8c3" stroke-width="2.5" stroke-dasharray="7 7" stroke-dasharray="none" marker-end="url(#arrow)"/><text x="382" y="240" fill="#d7e7f4" font-family="Arial" font-size="13" text-anchor="middle">HTTPS REST</text><polyline points="705,236 850,236" fill="none" stroke="#93a7c1" s