t x="795" y="371" fill="#d7e7f4" font-family="Arial" font-size="13" text-anchor="middle">Publish READY</text><polyline points="980,500 980,585" fill="none" stroke="#79d8c3" stroke-width="2.5" stroke-dasharray="7 7" stroke-dasharray="none" marker-end="url(#arrow)"/><text x="1042" y="551" fill="#d7e7f4" font-family="Arial" font-size="13" text-anchor="middle">Consume</text><polyline points="1110,635 1175,635" fill="none" stroke="#79d8c3" stroke-width="2.5" stroke-dasharray="7 7" stroke-dasharray="none" marker-end="url(#arrow)"/><text x="1145" y="614" fill="#d7e7f4" font-family="Arial" font-size="13" text-anchor="middle">Batch send</text><rect x="60" y="765" width="1390" height="90" rx="12" fill="#11283a" stroke="#31576b"/><text x="82" y="793" fill="#81e8cd" font-size="16" font-weight="700" font-family="Arial">Key design controls</text><text x="82" y="823" fill="#d9e6f3" font-size="15" font-family="Arial">Role + enrollment checks · Short-lived signed URLs · Async processing · Idempotent publication · Queue retries / DLQ · Audit logging</text><text x="82" y="844" fill="#99b2c9" font-size="12" font-family="Arial">Conceptual system design — provider products are illustrative alternatives, not one deployed stack.</text></svg>