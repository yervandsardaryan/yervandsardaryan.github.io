<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1550 525" role="img" aria-labelledby="t d"><title id="t">LMS video upload to notification sequence</title><desc id="d">Lecturer uploads video with presigned URL, video worker processes, backend publishes event, notification worker sends enrolled students a message, and student streams signed CDN media.</desc><rect width="1550" height="525" rx="20" fill="#0d1728"/><text x="48" y="51" font-family="Arial" font-size="25" font-weight="700" fill="#f1f8ff">Upload → Processing → Notification → Playback</text><text x="48" y="79" font-family="Arial" font-size="15" fill="#a5b9cf">End-to-end process · Conceptual sequence overview</text><rect x="48" y="124" width="460" height="145" rx="13" fill="#192c42" stroke="#3b6278"/><circle cx="84" cy="160" r="21" fill="#6be2bd"/><text x="84" y="166" fill="#062b26" font-family="Arial" font-size="16" font-weight="700" text-anchor="middle">01</text><text x="119" y="165" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Authorize</text><text x="68" y="209" fill="#b4c8d8" font-family="Arial" font-size="15">Lecturer requests short-lived upload URL</text><path d="M511,194 h30" stroke="#71e2be" stroke-width="3"/><path d="M540,188l9,6 -9,6" fill="#71e2be"/><rect x="548" y="124" width="460" height="145" rx="13" fill="#192c42" stroke="#3b6278"/><circle cx="584" cy="160" r="21" fill="#6be2bd"/><text x="584" y="166" fill="#062b26" font-family="Arial" font-size="16" font-weight="700" text-anchor="middle">02</text><text x="619" y="165" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Upload</text><text x="568" y="209" fill="#b4c8d8" font-family="Arial" font-size="15">Multipart file transfer to object storage</text><path d="M1011,194 h30" stroke="#71e2be" stroke-width="3"/><path d="M1040,188l9,6 -9,6" fill="#71e2be"/><rect x="1048" y="124" width="460" height="145" rx="13" fill="#192c42" stroke="#3b6278"/><circle cx="1084" cy="160" r="21" fill="#6be2bd"/><text x="1084" y="166" fill="#062b26" font-family="Arial" font-size="16" font-weight="700" text-anchor="middle">03</text><text x="1119" y="165" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Process</text><text x="1068" y="209" fill="#b4c8d8" font-family="Arial" font-size="15">Transcode to HLS + create thumbnail</text><rect x="48" y="302" width="460" height="145" rx="13" fill="#192c42" stroke="#3b6278"/><circle cx="84" cy="338" r="21" fill="#6be2bd"/><text x="84" y="344" fill="#062b26" font-family="Arial" font-size="16" font-weight="700" text-anchor="middle">04</text><text x="119" y="343" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Publish</text><text x="68" y="387" fill="#b4c8d8" font-family="Arial" font-size="15">Video marked READY; event emitted</text><path d="M511,372 h30" stroke="#71e2be" stroke-width="3"/><path d="M540,366l9,6 -9,6" fill="#71e2be"/><rect x="548" y="302" width="460" height="145" rx="13" fill="#192c42" stroke="#3b6278"/><circle cx="584" cy="338" r="21" fill="#6be2bd"/><text x="584" y="344" fill="#062b26" font-family="Arial" font-size="16" font-weight="700" text-anchor="middle">05</text><text x="619" y="343" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Notify</text><text x="568" y="387" fill="#b4c8d8" font-family="Arial" font-size="15">Enrolled students receive email/push</text><path d="M1011,372 h30" stroke="#71e2be" stroke-width="3"/><path d="M1040,366l9,6 -9,6" fill="#71e2be"/><rect x="1048" y="302" width="460" height="145" rx="13" fill="#192c42" stroke="#3b6278"/><circle cx="1084" cy="338" r="21" fill="#6be2bd"/><text x="1084" y="344" fill="#062b26" font-family="Arial" font-size="16" font-weight="700" text-anchor="middle">06</text><text x="1119" y="343" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Play</text><text x="1068" y="387" fill="#b4c8d8" font-family="Arial" font-size="15">Student gets authorized signed CDN URL</text><text x="49" y="505" font-size="13" font-family="Arial" fill="#96b0c8">The READY state gates publication; idempotent events prevent duplicate student notifications.</text></svg>